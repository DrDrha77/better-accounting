<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better Accounting</title>
    <meta name="description" content="Type a transaction in plain English and Better Accounting keeps your journal, ledger, trial balance and statements up to date." />
    <meta name="theme-color" content="#0f5c47" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Set the theme before first paint so dark mode doesn't flash light.
      (function () {
        var pref = 'system';
        var style = 'gradient';
        var design = 'classic';
        try {
          var stored = JSON.parse(localStorage.getItem('better-accounting:settings')) || {};
          var saved = stored.state || {};
          pref = saved.theme || 'system';
          // Lined paper only if chosen after the v4 redesign; everyone else gets the gradient.
          style = stored.version >= 4 && saved.style === 'ledger' ? 'ledger' : 'gradient';
          design = saved.design === 'apple' ? 'apple' : 'classic';
        } catch (e) {}
        try {
          var d = document.documentElement.dataset;
          d.text = saved.textSize || 'md';
          d.accent = saved.accent || 'default';
          d.density = saved.density || 'comfortable';
        } catch (e) {}
        document.documentElement.dataset.style = style;
        document.documentElement.dataset.design = design;
        // Load only the fonts the chosen design uses (the app loads the other set if you switch).
        var fonts = {
          classic: 'family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800',
          apple: 'family=Inter:wght@400;500;600;700',
        };
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://fonts.googleapis.com/css2?' + fonts[design] + '&display=swap';
        link.setAttribute('data-fonts', design);
        document.head.appendChild(link);
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
